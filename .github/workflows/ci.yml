name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.28'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.3'
          terraform_wrapper: false
      - name: Validate Terraform without cloud credentials
        run: |
          terraform fmt -check -recursive terraform
          for directory in terraform/foundation terraform/agent terraform/public; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done
      - name: Validate shell scripts
        run: shellcheck scripts/*.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and smoke-test the container
        run: |
          docker build --tag prototype-ci .
          docker run --detach --name prototype-ci -p 127.0.0.1:8080:8080 prototype-ci
          trap 'docker logs prototype-ci; docker rm -f prototype-ci' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
