name: Diagnose Agent Runtime
on:
  workflow_dispatch:
    inputs:
      engine_id:
        description: Numeric Agent Runtime ID to inspect
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'aitech-good-s27493' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      ENGINE_ID: ${{ inputs.engine_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Inspect deployment metadata
        run: |
          [[ "$ENGINE_ID" =~ ^[0-9]+$ ]]
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://${GCP_REGION}-aiplatform.googleapis.com/v1/projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/reasoningEngines/${ENGINE_ID}" \
            | jq '{error, name, displayName, createTime, updateTime, contextSpec, spec: {containerSpec: .spec.containerSpec, serviceAccount: .spec.serviceAccount, deploymentSpec: (.spec.deploymentSpec | del(.env, .secretEnv))}}'
      - name: Inspect deployment operations
        if: always()
        run: |
          [[ "$ENGINE_ID" =~ ^[0-9]+$ ]]
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://${GCP_REGION}-aiplatform.googleapis.com/v1/projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/reasoningEngines/${ENGINE_ID}/operations" \
            | jq '{error, operations: [.operations[]? | {name,done,error,metadata}]}'
      - name: Inspect authenticated health response
        if: always()
        run: |
          [[ "$ENGINE_ID" =~ ^[0-9]+$ ]]
          curl --silent --show-error --max-time 180 --write-out '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H 'Content-Type: application/json' \
            -d '{"class_method":"health","input":{}}' \
            "https://${GCP_REGION}-aiplatform.googleapis.com/v1/projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/reasoningEngines/${ENGINE_ID}:query"
      - name: Inspect runtime logs
        if: always()
        run: |
          gcloud logging read 'resource.type="aiplatform.googleapis.com/ReasoningEngine"' \
            --project="$GCP_PROJECT_ID" --freshness=1h --limit=50 \
            --format='table(timestamp,severity,textPayload,jsonPayload.message)'
      - name: Inspect agent image access
        if: always()
        run: |
          gcloud artifacts repositories get-iam-policy prototype-agents \
            --project="$GCP_PROJECT_ID" --location="$GCP_REGION" --format=json
          gcloud projects get-iam-policy "$GCP_PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter='bindings.members:gcp-sa-aiplatform' \
            --format='table(bindings.role,bindings.members)'
