[project]
name = "prototype-video-agent"
version = "0.1.0"
description = "Gemini video analysis on Google Cloud Agent Runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "google-genai>=1.0,<3",
  "google-cloud-storage>=3,<4",
  "google-adk>=2.9.2",
  "google-cloud-aiplatform[adk]>=2.1.3",
  "google-cloud-firestore>=2.19,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
